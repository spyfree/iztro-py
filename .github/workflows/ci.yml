name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    name: Test on Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
        # Installs the iztro JS reference pinned by package-lock.json into
        # ./node_modules, where the alignment suite discovers it automatically.
        npm ci

    - name: Run tests
      env:
        # Turns "JS reference unavailable" from a skip into a hard failure, so
        # the alignment suite can never silently stop running in CI.
        IZTRO_REQUIRE_JS_REFERENCE: '1'
      run: |
        pytest -v --cov=src/iztro_py --cov-report=xml --cov-report=term

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        file: ./coverage.xml
        fail_ci_if_error: false

  type-check:
    name: Type checking with mypy
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    # Previously `|| true` *and* continue-on-error, so 30+ type errors
    # accumulated unnoticed. Both removed: the tree is clean, keep it that way.
    - name: Run mypy
      run: |
        mypy src/iztro_py --ignore-missing-imports

  code-quality:
    name: Code quality checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: Check code formatting with Black
      run: |
        python -m black --version
        python -m black --check src tests

    # Rules are now selected explicitly in pyproject.toml, so this is stable
    # against ruff changing its defaults and no longer needs continue-on-error.
    - name: Lint with Ruff
      run: |
        ruff check src tests scripts
