[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iztro-py"
version = "0.5.0"
description = "A pure Python implementation of iztro - A lightweight Zi Wei Dou Shu (Purple Star Astrology) library with full i18n support (6 languages)"
readme = "README.md"
requires-python = ">=3.8"
authors = [
    {name = "iztro-py Contributors"}
]
keywords = ["astrology", "ziwei", "ziweidoushu", "purple-star", "chinese-astrology"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "pydantic>=2.0.0",
    "python-dateutil>=2.8.0",
    "lunarcalendar>=0.0.9",
    "lunar_python>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "black==24.4.2",
    "mypy>=1.0.0",
    "ruff>=0.16.0,<0.17",
]
docs = [
    "sphinx>=7.0.0",
    "sphinx-rtd-theme>=2.0.0",
    "sphinx-autodoc-typehints>=1.25.0",
    "myst-parser>=2.0.0",
]

[project.urls]
Homepage = "https://github.com/spyfree/iztro-py"
Documentation = "https://spyfree.github.io/iztro-py/"
Repository = "https://github.com/spyfree/iztro-py"
Issues = "https://github.com/spyfree/iztro-py/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py38", "py39", "py310", "py311"]

[tool.mypy]
# No python_version pin: current mypy refuses anything below 3.10, while the
# package still supports 3.8+. Python-version-specific syntax compatibility is
# enforced by ruff's target-version = "py38" instead.
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 100
target-version = "py38"

# Select rules explicitly. Without this ruff applies whatever its current
# default set happens to be, so an unpinned ruff silently changes what CI
# enforces from run to run — which is why the lint step was previously marked
# continue-on-error and its findings went unread.
[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # import sorting
    "B",    # bugbear
    "SIM",  # simplifications
    "PERF", # obvious performance traps
]
ignore = [
    "E501",  # line length is black's job
]

[tool.ruff.lint.per-file-ignores]
# Locale modules are generated data tables, not hand-written code.
"src/iztro_py/i18n/locales/*.py" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Ensure the in-repo `src/` layout always shadows any globally-installed
# iztro-py (e.g. an older PyPI build in site-packages). pytest prepends these
# to sys.path before collection, so every test imports the working tree
# deterministically, regardless of collection order or per-file path hacks.
pythonpath = ["src"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
